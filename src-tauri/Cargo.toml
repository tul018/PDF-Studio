[package]
name = "pdf-studio"
version = "0.2.1"
description = "Fast, crash-resistant PDF viewer and editor"
edition = "2021"
rust-version = "1.77"

[lib]
# staticlib/cdylib are required for the iOS (and Android) targets.
name = "pdf_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1.53.3", features = ["net", "sync", "rt", "macros", "time"] }
tokio-tungstenite = "0.29.0"
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }
serde_json = "1.0.154"
local-ip-address = "0.6.13"
getrandom = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

[target.'cfg(any(target_os = "macos", windows, target_os = "linux"))'.dependencies]
tauri-plugin-updater = "2"
