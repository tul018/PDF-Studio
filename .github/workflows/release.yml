name: Build apps

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  windows:
    name: Windows installer (NSIS + MSI)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run app:build
      - uses: actions/upload-artifact@v4
        with:
          name: pdf-studio-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

  ios:
    name: iOS / iPadOS app
    runs-on: macos-latest
    env:
      APPLE_DEVELOPMENT_TEAM: ${{ secrets.APPLE_DEVELOPMENT_TEAM }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim
      - run: npm ci
      - run: npx tauri ios init --ci
      - name: Build (signed .ipa when APPLE_DEVELOPMENT_TEAM is set, simulator build otherwise)
        run: |
          if [ -n "$APPLE_DEVELOPMENT_TEAM" ]; then
            npx tauri ios build --ci --export-method app-store-connect
          else
            echo "No signing team configured - building for the iOS Simulator only."
            npx tauri ios build --ci --target aarch64-sim --debug || npx tauri ios build --ci --target aarch64-sim
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: pdf-studio-ios
          path: |
            src-tauri/gen/apple/build/**/*.ipa
            src-tauri/gen/apple/build/**/*.app
          if-no-files-found: warn
